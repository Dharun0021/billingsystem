
name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pages/**"
      - "src/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and Publish Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            dharunk021/billingsytem:latest
            dharunk021/billingsytem:${{ github.sha }}

  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy frontend through SSM
        env:
          IMAGE: dharunk021/billingsytem:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > deploy-frontend.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          CONTAINER="billing-frontend"
          BACKUP="billing-frontend-rollback"
          IMAGE="__IMAGE__"

          echo "Deploying frontend image: $IMAGE"

          if ! docker inspect "$CONTAINER" >/dev/null 2>&1; then
            echo "ERROR: Existing frontend container not found."
            exit 1
          fi

          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
            echo "ERROR: Existing frontend container is not running."
            exit 1
          fi

          # Preserve the current frontend environment variables.
          ENV_FILE=$(mktemp)
          chmod 600 "$ENV_FILE"
          trap 'rm -f "$ENV_FILE"' EXIT

          docker inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "$CONTAINER" > "$ENV_FILE"

          # Download the exact image produced by this workflow run.
          docker pull "$IMAGE"

          # Retain the current container as the rollback option.
          docker rm -f "$BACKUP" >/dev/null 2>&1 || true
          docker stop "$CONTAINER"
          docker rename "$CONTAINER" "$BACKUP"

          # Preserve the existing localhost port mapping.
          if ! docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 127.0.0.1:3001:3000 \
            --env-file "$ENV_FILE" \
            "$IMAGE"; then

            echo "ERROR: New frontend failed to start. Restoring previous container."
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker rename "$BACKUP" "$CONTAINER"
            docker start "$CONTAINER"
            exit 1
          fi

          # Wait up to 60 seconds for an HTTP response.
          HEALTHY=false

          for i in $(seq 1 30); do
            RUNNING=$(docker inspect -f '{{.State.Running}}' \
              "$CONTAINER" 2>/dev/null || echo false)

            if [ "$RUNNING" != "true" ]; then
              echo "Frontend container stopped unexpectedly."
              docker logs --tail 80 "$CONTAINER" || true
              break
            fi

            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 2 http://127.0.0.1:3001/ || true)

            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then
              HEALTHY=true
              echo "Frontend returned HTTP $CODE."
              break
            fi

            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Frontend did not respond. Rolling back."

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker rename "$BACKUP" "$CONTAINER"
            docker start "$CONTAINER"

            echo "Rollback attempted. Verify the previous frontend."
            exit 1
          fi

          echo "Frontend deployment succeeded."
          docker ps --filter "name=^/${CONTAINER}$" \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          REMOTE

          # Insert the immutable image tag.
          sed -i "s|__IMAGE__|$IMAGE|g" deploy-frontend.sh

          # Encode the script to avoid SSM shell-quoting issues.
          SCRIPT_B64=$(base64 -w 0 deploy-frontend.sh)
          REMOTE_COMMAND="echo '$SCRIPT_B64' | base64 -d | bash"

          jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}' > ssm-parameters.json

          echo "Submitting frontend deployment to SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0616bee576adfc334 \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          echo "Waiting for frontend deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0616bee576adfc334 || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0616bee576adfc334 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent,Code:ResponseCode}' \
            --output json > deployment-result.json

          cat deployment-result.json

          STATUS=$(jq -r '.Status' deployment-result.json)

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: Frontend deployment failed: $STATUS"
            exit 1
          fi

          echo "Frontend deployment completed successfully."
