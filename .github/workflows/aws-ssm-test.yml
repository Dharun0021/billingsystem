
name: AWS SSM Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-aws-ssm:
    name: Test AWS Credentials and SSM
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS secrets are available
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "ACCESS_KEY_ID is missing"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "SECRET_ACCESS_KEY is missing"; exit 1; }
          test -n "$AWS_REGION" || { echo "AWS_REGION is missing"; exit 1; }
          echo "All three AWS secrets are available."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send test command to EC2 through SSM
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0616bee576adfc334 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo SSM_CD_TEST"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted successfully."

      - name: Wait for SSM command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send-command.outputs.command_id }}" \
            --instance-id i-0616bee576adfc334

      - name: Check SSM command result
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send-command.outputs.command_id }}" \
            --instance-id i-0616bee576adfc334 \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
